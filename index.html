<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실로폰 연주</title>
<script>/* 마지막에 쓴 악기로 열기 */try{const nav=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];if(localStorage.getItem('site.inst')==='janggu'&&!(nav&&nav.type==='back_forward'))location.replace('janggu.html');else localStorage.setItem('site.inst','xylo')}catch(e){}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ───────── 디자인 토큰 (DESIGN-apple.md) ───────── */
:root{
  --primary:#0066cc; --primary-focus:#0071e3; --primary-on-dark:#2997ff;
  --ink:#1d1d1f; --on-dark:#ffffff; --body-muted:#cccccc;
  --ink-80:#333333; --ink-48:#7a7a7a;
  --divider-soft:#f0f0f0; --hairline:#e0e0e0;
  --canvas:#ffffff; --parchment:#f5f5f7; --pearl:#fafafc;
  --tile-1:#272729; --black:#000000; --chip:rgba(210,210,215,.64);
  --r-sm:.5rem; --r-md:.6875rem; --r-lg:1.125rem; --pill:9999px;
  --font:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
/* TV 크기 보정: 1280px에서 16px → 1920px에서 24px */
html{font-size:clamp(14px,min(1.25vw,2.22vh),30px)}
*{box-sizing:border-box}
body{
  margin:0;height:100vh;height:100dvh;overflow:hidden;
  background:var(--tile-1);color:var(--ink);
  font-family:var(--font);-webkit-font-smoothing:antialiased;
}
button,select,input{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
button:active{transform:scale(.95)}
:focus-visible{outline:2px solid var(--primary-focus);outline-offset:2px}

.app{display:flex;flex-direction:column;height:100%}

/* ───────── 상단바 ───────── */
.nav{
  flex:0 0 auto;height:2.75rem;background:var(--black);color:var(--on-dark);
  display:flex;align-items:center;justify-content:flex-end;padding:0 1.5rem;
}
.nav-links{display:flex;align-items:center;gap:.5rem}
/* 악기 바꾸기 (실로폰 · 장구): 지금 악기 = 흰 글씨, 다른 악기 = 흐린 글씨 */
.inst-links{display:flex;align-items:center;gap:.25rem;margin-right:auto}
.inst{color:var(--on-dark);opacity:.48;text-decoration:none;font-size:.8rem;padding:.45rem .8rem;border-radius:var(--r-sm)}
.inst[aria-current="page"]{opacity:1;font-weight:600}
.nav-btn{
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border:0;color:var(--on-dark);opacity:.88;
  font-size:.8rem;padding:.45rem .8rem;border-radius:var(--r-sm);
}
.nav-btn svg{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.fs .nav{display:none}

/* ───────── 연주 무대 (어두운 타일) ───────── */
.stage{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;
  padding:1.1rem 1rem .2rem;background:var(--tile-1);color:var(--on-dark);
}
.stage h1{margin:0;font-size:2.5rem;font-weight:600;line-height:1.1;letter-spacing:-.02em;text-align:center}
.xylo-wrap{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:.6rem 0 .3rem}
#xylo{width:100%;height:100%;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
#xylo .case{filter:drop-shadow(3px 5px 30px rgba(0,0,0,.22))}
#xylo .bar{cursor:pointer;transform-box:fill-box;transform-origin:center}
#xylo .bar .flash{opacity:0;pointer-events:none}
#xylo .bar.hit{animation:barHit .3s cubic-bezier(.2,.8,.2,1)}
#xylo .bar.hit .flash{animation:barFlash .45s ease-out}
@keyframes barHit{0%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes barFlash{0%{opacity:.42}100%{opacity:0}}
#xylo .mallet{pointer-events:none}
#xylo text{font-family:var(--font);pointer-events:none}

/* ───────── 하단 악보바 (반투명 + 흐림) ───────── */
.dock{
  flex:0 0 auto;position:relative;z-index:2;height:7.4rem;
  display:flex;align-items:center;gap:1.5rem;padding:0 1.5rem 0 2rem;
  background:rgba(245,245,247,.86);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
}
.score{flex:1 1 auto;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center;gap:.25rem;padding:.4rem 0 .55rem}
#strip{
  position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:.3rem;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;white-space:nowrap;padding:0 .5rem;
  cursor:grab;touch-action:pan-x;user-select:none;-webkit-user-select:none;
}
#strip::-webkit-scrollbar{display:none}
#strip.dragging{cursor:grabbing}
#strip .tk{cursor:pointer}
#strip.dragging .tk{cursor:grabbing}
#stripSlider{-webkit-appearance:none;appearance:none;width:100%;height:1.1rem;margin:0;background:transparent;cursor:pointer}
#stripSlider[hidden]{display:block;visibility:hidden}
#stripSlider::-webkit-slider-runnable-track{height:.3rem;border-radius:var(--pill);background:rgba(0,0,0,.12)}
#stripSlider::-moz-range-track{height:.3rem;border-radius:var(--pill);background:rgba(0,0,0,.12)}
#stripSlider::-webkit-slider-thumb{-webkit-appearance:none;width:3.2rem;height:1rem;margin-top:-.35rem;border:0;border-radius:var(--pill);background:var(--primary)}
#stripSlider::-moz-range-thumb{width:3.2rem;height:1rem;border:0;border-radius:var(--pill);background:var(--primary)}
.empty{font-size:1.05rem;color:var(--ink-48)}
.tk{
  position:relative;flex:0 0 auto;display:inline-flex;flex-direction:column;align-items:center;
  padding:.5rem .62rem .55rem;border:2px solid transparent;border-radius:var(--pill);
  font-size:2.15rem;font-weight:600;line-height:1;letter-spacing:-.02em;color:var(--ink);
  transition:opacity .2s ease,border-color .15s ease,background-color .15s ease;
}
.tk .sw{display:block;width:1.3rem;height:.3rem;border-radius:.15rem;margin-top:.32rem}
.tk.hi::before{content:"";position:absolute;top:.12rem;left:50%;width:.36rem;height:.36rem;margin-left:-.18rem;border-radius:50%;background:var(--ink)}
.tk.lo::after{content:"";position:absolute;bottom:.02rem;left:50%;width:.36rem;height:.36rem;margin-left:-.18rem;border-radius:50%;background:var(--ink)}
.tk.hold,.tk.rest,.tk.empty{font-weight:400;color:var(--ink-48)}
.tk.hold .sw,.tk.rest .sw,.tk.empty .sw{background:transparent}
.tk.now{border-color:var(--primary-focus);background:var(--canvas)}
.tk.past{opacity:.35}
.grp{display:inline-flex;flex:0 0 auto;align-items:center;border-bottom:2px solid rgba(0,0,0,.16);border-radius:.4rem;padding:0 .1rem}
.grp .tk{padding-left:.35rem;padding-right:.35rem}
.sep{flex:0 0 auto;width:2px;height:2.6rem;margin:0 .45rem;border-radius:1px;background:rgba(0,0,0,.2)}
.sep.line{width:3px;height:3.4rem;margin:0 1rem;background:rgba(0,0,0,.32)}

.ctrls{flex:0 0 auto;display:flex;align-items:center;gap:.7rem}
.btn-pearl{
  display:inline-flex;align-items:center;justify-content:center;min-width:3.4rem;min-height:3.2rem;
  background:var(--pearl);color:var(--ink-80);border:3px solid var(--divider-soft);border-radius:var(--r-md);
  padding:.4rem .8rem;font-size:1.5rem;line-height:1;
}
.btn-play{
  display:inline-flex;align-items:center;justify-content:center;width:5.2rem;height:3.6rem;
  background:transparent;color:var(--ink);border:2px solid var(--primary);border-radius:var(--pill);
  transition:background-color .2s ease,color .2s ease,transform .12s ease;
}
.btn-play svg{width:1.35rem;height:1.35rem;fill:currentColor}
.btn-play:hover,.btn-play:focus-visible,.btn-play.playing{background:var(--primary);color:#fff}
.btn-primary{
  display:inline-flex;align-items:center;gap:.55rem;min-height:3rem;
  background:var(--primary);color:#fff;border:0;border-radius:var(--pill);
  padding:.7rem 1.6rem;font-size:1.05rem;font-weight:400;letter-spacing:-.01em;
}

/* ───────── 편집 패널 (밝은 타일, 옆에서 천천히 밀려 나옴) ───────── */
.scrim{
  position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;
  transition:opacity .6s cubic-bezier(.4,0,.2,1) .1s;
}
.scrim.open{opacity:1;pointer-events:auto;transition:opacity .7s cubic-bezier(.32,.72,0,1)}
.panel{
  position:fixed;z-index:10;top:0;right:0;bottom:0;width:min(34rem,94vw);
  display:flex;flex-direction:column;background:var(--parchment);color:var(--ink);
  transform:translateX(100%);visibility:hidden;will-change:transform;
  transition:transform .6s cubic-bezier(.4,0,.2,1) .1s,visibility 0s linear .72s;
}
.panel.open{transform:none;visibility:visible;transition:transform .7s cubic-bezier(.32,.72,0,1),visibility 0s}
.panel .inner{display:flex;flex-direction:column;min-height:0;flex:1 1 auto;opacity:0;transition:opacity .2s ease}
.panel.open .inner{opacity:1;transition:opacity .4s ease .25s}
@media (prefers-reduced-motion: reduce){
  .panel,.panel.open{transform:none;transition:opacity .3s ease,visibility 0s linear .3s;opacity:0}
  .panel.open{opacity:1;transition:opacity .3s ease,visibility 0s}
  .panel .inner,.panel.open .inner{transition:none;opacity:1}
}
.panel header{display:flex;align-items:center;justify-content:space-between;padding:1.3rem 1.5rem .5rem}
.panel h2{margin:0;font-size:1.7rem;font-weight:600;letter-spacing:-.02em}
.icon-btn{width:2.75rem;height:2.75rem;border-radius:50%;border:0;background:var(--chip);color:var(--ink);font-size:1.1rem;display:grid;place-items:center}
.panel .scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:.3rem 1.5rem 1.5rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{
  border:1px solid var(--hairline);background:var(--canvas);color:var(--ink);
  border-radius:var(--pill);padding:.55rem 1rem;font-size:.875rem;
}
.chip.on{border:2px solid var(--primary-focus);padding:calc(.55rem - 1px) calc(1rem - 1px)}
.chip.add{color:var(--primary)}
.card{margin-top:1rem;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:1.1rem 1.2rem}
.field{
  font-size:1rem;line-height:1.47;color:var(--ink);
  background:var(--canvas);border:1px solid rgba(0,0,0,.12);border-radius:var(--r-sm);padding:.45rem .7rem;
}
.settings{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem 1.4rem}
.settings label{display:flex;align-items:center;gap:.6rem;font-size:.95rem}
.settings .title-in{width:15rem}
.seg{display:inline-flex;gap:.35rem}
.seg button{border:1px solid var(--hairline);background:var(--canvas);color:var(--ink);border-radius:var(--pill);padding:.4rem .85rem;font-size:.875rem}
.seg button.on{border:2px solid var(--primary-focus);padding:calc(.4rem - 1px) calc(.85rem - 1px)}
input[type=range]{accent-color:var(--primary)}
.link{background:none;border:0;padding:.2rem 0;color:var(--primary);font-size:.95rem}

/* 박자 칸 (세로로 쌓고, 칸 폭은 패널에 맞춤) */
.grid{display:flex;flex-direction:column;gap:.8rem}
.grow{display:flex;gap:.35rem}
.ms{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.mnum{font-size:.7rem;color:var(--ink-48);padding-left:.15rem;white-space:nowrap;overflow:hidden}
.mcells{display:flex;border:1px solid rgba(0,0,0,.18);border-radius:var(--r-sm);background:var(--canvas)}
.filler{min-width:0}
.cell{position:relative;flex:1 1 0;min-width:0;height:3.4rem;border-left:1px solid var(--divider-soft)}
.cell:first-child{border-left:0}
.cell input{
  display:block;width:100%;height:100%;border:0;background:transparent;padding:0 .1rem .5rem;
  text-align:center;font-size:1.05rem;font-weight:600;color:var(--ink);border-radius:var(--r-sm);
}
.cell input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--primary-focus)}
.cell.multi input{font-size:.85rem;letter-spacing:-.04em}
.cell.bad input{color:var(--ink-48);opacity:.55}
.cell .bars{position:absolute;left:18%;right:18%;bottom:.45rem;display:flex;gap:2px;pointer-events:none}
.cell .bars i{flex:1 1 0;height:.2rem;border-radius:.1rem}
.cell .edge{position:absolute;top:0;bottom:0;width:9px;z-index:2;cursor:pointer}
.cell .edge.l{left:-5px}
.cell .edge.r{right:-5px}
.cell .edge:hover::after{content:"";position:absolute;top:.2rem;bottom:.2rem;left:3px;width:3px;border-radius:2px;background:var(--primary)}

.set{display:flex;align-items:center;gap:1rem;min-height:3rem}
.set+.set{border-top:1px solid var(--divider-soft)}
.set>span{flex:1 1 auto;font-size:1rem}
.set input[type=range]{flex:0 1 12rem}
.set b{width:2.6rem;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.switch{position:relative;width:2.9rem;height:1.75rem;border:0;border-radius:var(--pill);background:#d2d2d7;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.35rem;height:1.35rem;border-radius:50%;background:#fff;transition:transform .2s ease}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(1.15rem)}
.panel footer{padding:.9rem 1.5rem 1.3rem;display:flex;justify-content:flex-end}
</style>
</head>
<body>
<div class="app">
  <nav class="nav">
    <div class="inst-links">
      <a class="inst" href="index.html" aria-current="page" onclick="try{localStorage.setItem('site.inst','xylo')}catch(e){}">실로폰</a>
      <a class="inst" href="janggu.html" onclick="try{localStorage.setItem('site.inst','janggu')}catch(e){}">장구</a>
    </div>
    <div class="nav-links">
      <button class="nav-btn" id="btnEdit">편집</button>
      <button class="nav-btn" id="btnFull" aria-label="전체화면"></button>
    </div>
  </nav>

  <main class="stage">
    <h1 id="songTitle"></h1>
    <div class="xylo-wrap"><svg id="xylo" role="img" aria-label="25음 실로폰"></svg></div>
  </main>

  <footer class="dock">
    <div class="score">
      <div id="strip" aria-live="off"></div>
      <input type="range" id="stripSlider" min="0" max="1000" value="0" aria-label="악보 이동">
    </div>

</div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-hidden="true">
 <div class="inner">
  <header>
    <h2>편집</h2>
    <button class="icon-btn" id="btnClose" aria-label="닫기">✕</button>
  </header>
  <div class="scroll">
    <div class="chips" id="chips"></div>

    <section class="card">
      <div class="settings">
        <label>제목 <input class="field title-in" id="titleIn" type="text" autocomplete="off"></label>
        <label>박자 <span class="seg" id="segMeter"></span></label>
        <label>못갖춘마디 <select class="field" id="pickupSel"></select></label>
        <label>한 줄 <select class="field" id="perLineSel"></select></label>
        <label>빠르기 <input type="range" id="tempo" min="40" max="160" step="2"><b id="tempoVal">90</b></label>
      </div>

    <section class="card">
      <div class="grid" id="grid"></div>
    </section>

    <section class="card">
      <div class="set"><span>메트로놈</span><span class="seg" id="segMetro">
        <button data-m="off">끔</button><button data-m="empty">빈 박만</button>
      </span></div>
      <div class="set"><span>메트로놈 크기</span><input type="range" id="metroVol" min="0" max="100" step="5"><b id="metroVolVal">70</b></div>
      <div class="set"><span>예비박</span><button class="switch" id="swCount" role="switch" aria-label="예비박"></button></div>
      <div class="set"><span>반복 재생</span><button class="switch" id="swLoop" role="switch" aria-label="반복 재생"></button></div>
    </section>

    <section class="card">
      <div class="set"><span>내 곡 파일로</span>
        <button class="link" id="btnExport">내보내기</button>
        <button class="link" id="btnImport">가져오기</button>
        <input type="file" id="fileIn" accept=".json,application/json" hidden>
      </div>
      <div class="set"><span>지금 곡</span><button class="link" id="btnDelete">이 곡 지우기</button></div>
    </section>
  </div>
  <footer><button class="btn-primary" id="btnApply">적용하고 닫기</button></footer>
 </div>
</aside>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ═════════ 1. 실로폰 음판 데이터 (실물 25음: 낮은라 ~ 높은라) ═════════ */
const BASE = { '도': 72, '레': 74, '미': 76, '파': 77, '솔': 79, '라': 81, '시': 83 };
const COLORS = { '도': '#D7262B', '레': '#EE7A2A', '미': '#F7D320', '파': '#3BA846', '솔': '#2DB4DA', '라': '#3A3594', '시': '#7B2E8C' };
const SHARP_COLOR = '#2458B8';
const NATURALS = [['라',-1],['시',-1],['도',0],['레',0],['미',0],['파',0],['솔',0],['라',0],['시',0],['도',1],['레',1],['미',1],['파',1],['솔',1],['라',1]];
const octMark = o => o > 0 ? "'" : o < 0 ? ',' : '';

const NW = 80, NSTEP = 96, NX0 = 88, NTOP = 300, NLEN0 = 440, NLEN1 = 250, SBOT = 282;
const nCx = i => NX0 + NW / 2 + i * NSTEP;
const nLen = i => NLEN0 - (NLEN0 - NLEN1) * i / 14;
const S_CX0 = (nCx(0) + nCx(1)) / 2, S_CX1 = (nCx(13) + nCx(14)) / 2;
const sLen = cx => 210 - 60 * (cx - S_CX0) / (S_CX1 - S_CX0);

const bars = [];
const barByMidi = new Map();
NATURALS.forEach(([name, oct], i) => {
  const len = nLen(i), cx = nCx(i), top = NTOP, sy = top + len * 0.62;
  bars.push({ midi: BASE[name] + 12 * oct, label: name, oct, canon: name + octMark(oct), sharp: false, color: COLORS[name],
    cx, x: cx - NW / 2, w: NW, top, len, labelY: top + len * 0.33, sx: cx, sy, hx: cx, hy: sy + 72 });
});
for (let i = 0; i < 14; i++) {
  const a = bars[i], b = bars[i + 1];
  if (b.midi - a.midi !== 2) continue;
  const cx = (a.cx + b.cx) / 2, len = sLen(cx), top = SBOT - len, sy = top + len * 0.68;
  bars.push({ midi: a.midi + 1, label: a.label + '#', oct: a.oct, canon: a.label + '#' + octMark(a.oct), sharp: true, color: SHARP_COLOR,
    cx, x: cx - NW / 2, w: NW, top, len, labelY: top + len * 0.36, sx: cx, sy, hx: cx, hy: sy + 72 });
}
bars.forEach(b => barByMidi.set(b.midi, b));

/* ═════════ 2. 계이름 글자 해석 ═════════ */
const NOTE_CH = '도레미파솔라시';
const ALIAS = { '쏠': '솔', '씨': '시' };
const noteAt = (src, j) => { const c = ALIAS[src[j]] || src[j]; return c && NOTE_CH.includes(c) ? c : null; };
const HOLD_CH = '-–—~ㅡ';

function lex(src) {
  const out = [];
  let i = 0, line = 1;
  while (i < src.length) {
    const c = src[i];
    if (c === '\n') { out.push({ k: 'nl', line }); line++; i++; continue; }
    if (/\s/.test(c)) { i++; continue; }
    if (c === '|' || c === '｜') { out.push({ k: 'bar', line }); i++; continue; }
    if (c === '(' || c === '（') { out.push({ k: '(', line }); i++; continue; }
    if (c === ')' || c === '）') { out.push({ k: ')', line }); i++; continue; }
    if (HOLD_CH.includes(c)) { out.push({ k: 'hold', line }); i++; continue; }
    if (c === '_' || c === '쉼') { out.push({ k: 'rest', line }); i++; continue; }
    let j = i, oct = 0;
    if (src.startsWith('높은', j)) { oct = 1; j += 2; }
    else if (src.startsWith('낮은', j)) { oct = -1; j += 2; }
    if (oct !== 0) while (src[j] === ' ') j++;
    const name = noteAt(src, j);
    if (name) {
      j++;
      let acc = 0;
      for (;;) {
        const m = src[j];
        if (m === "'" || m === '’' || m === '′' || m === '`') { oct++; j++; }
        else if (m === ',' || m === '，') { oct--; j++; }
        else if (m === '#' || m === '♯') { acc++; j++; }
        else if (m === '♭' || m === 'b') { acc--; j++; }
        else break;
      }
      out.push({ k: 'note', line, name, oct, acc });
      i = j; continue;
    }
    j = i;
    while (j < src.length && !/\s/.test(src[j]) && !'|｜()（）_쉼'.includes(src[j]) && !HOLD_CH.includes(src[j])
           && !noteAt(src, j) && !src.startsWith('높은', j) && !src.startsWith('낮은', j)) j++;
    if (j === i) j = i + 1;
    out.push({ k: 'err', line });
    i = j;
  }
  return out;
}

// 기본 곡 글자 → 칸 목록 (괄호 안 = 한 칸)
function textToCells(text) {
  const lx = lex(text), cells = [];
  const part = u => {
    if (u.k === 'hold') return '-';
    if (u.k === 'rest') return '_';
    const bar = barByMidi.get(BASE[u.name] + 12 * u.oct + u.acc);
    return bar ? bar.canon : '_';
  };
  const timed = u => u.k === 'note' || u.k === 'rest' || u.k === 'hold';
  for (let k = 0; k < lx.length; k++) {
    const u = lx[k];
    if (timed(u)) cells.push(part(u));
    else if (u.k === '(') {
      const g = [];
      for (k++; k < lx.length && lx[k].k !== ')'; k++) if (timed(lx[k])) g.push(part(lx[k]));
      if (g.length) cells.push(g.join(''));
    }
  }
  return cells;
}

// 칸 하나 해석 (한 박 = 칸 하나, 칸 안의 음은 똑같이 나눔)
const cellCache = new Map();
function parseCell(text) {
  const key = text || '';
  if (cellCache.has(key)) return cellCache.get(key);
  const res = { units: [], bad: false, empty: key.trim() === '' };
  for (const u of lex(key)) {
    if (u.k === '(' || u.k === ')') continue;
    if (u.k === 'note') {
      const bar = barByMidi.get(BASE[u.name] + 12 * u.oct + u.acc);
      if (!bar) { res.bad = true; continue; }
      res.units.push({ k: 'note', bar, label: u.name + (u.acc > 0 ? '#' : u.acc < 0 ? '♭' : ''), oct: u.oct });
    } else if (u.k === 'hold' || u.k === 'rest') res.units.push({ k: u.k });
    else res.bad = true;
  }
  if (!res.empty && (res.units.length === 0 || res.units.length > 4)) res.bad = true;
  cellCache.set(key, res);
  return res;
}

  switch (c && c.t) {
    case 'n': return c.n;
    case 'p': return c.a + (c.b || '');

}

  const a = cells.slice();
  while (a.length > 1 && a[a.length - 1] === '') a.pop();

}

function loadState() {
  let s = readJSON(STORE_KEY);
  if (s && s.v === 3) {
    s = Object.assign(defaultState(), s);

    if (!['off', 'empty'].includes(s.metro.mode)) s.metro.mode = 'empty';
    s.songs = (s.songs || []).filter(validSong);
  } else {

      s.loop = !!v2.loop;
      if (v2.metro) { s.metro.vol = v2.metro.vol ?? 70; s.metro.countIn = v2.metro.countIn !== false; s.metro.mode = v2.metro.mode === 'off' ? 'off' : 'empty'; }

          pickup: c.pickup || 0, perLine: c.perLine || 4, cells: trimCells(c.measures.flat().map(v2Cell)) });
      }

    } else {
      const v1 = readJSON('xylo.v1');

        s.loop = !!v1.loop;
        for (const o of v1.songs) {

          const original = o.id === 'ode' ? PRESET_DEFS[0].text : V1_XMAS;

            tempo: o.tempo || 90, meter: 4, pickup: 0, perLine: 4, cells: trimCells(textToCells(o.text || '')) });

/* ═════════ 5. 칸 → 연주 목록 ═════════ */
const pickupCells = s => s.pickup > 0 ? Math.ceil(s.pickup) : 0;
function cellPos(song, i) {
  const pc = pickupCells(song);
  if (i < pc) return { mi: 0, ci: i };
  return { mi: (pc ? 1 : 0) + Math.floor((i - pc) / song.meter), ci: (i - pc) % song.meter };
}

function build(song) {
  const events = [], toks = [], beats = [];
  let b = 0, last = null;
  const pc = pickupCells(song);
  const addNote = (u, start, dur) => {
    const tk = { k: 'note', start, dur, label: u.label, oct: u.oct, bar: u.bar };
    const ev = { midi: u.bar.midi, bar: u.bar, start, dur, token: tk };
    tk.ev = ev; toks.push(tk); events.push(ev); last = ev;
  };
  const addHold = (start, dur) => {
    const tk = { k: 'hold', start, dur };
    if (last) { last.dur += dur; tk.ev = last; }
    else { const ev = { midi: null, start, dur, token: tk }; events.push(ev); tk.ev = ev; last = ev; }
    toks.push(tk);
  };
  const addRest = (start, dur, kind) => {
    const tk = { k: kind, start, dur };
    const ev = { midi: null, start, dur, token: tk };
    tk.ev = ev; toks.push(tk); events.push(ev); last = ev;
  };
  song.cells.forEach((text, i) => {
    const { mi, ci } = cellPos(song, i);
    if (i > 0 && ci === 0) {
      const fullIdx = pc ? mi - 1 : mi;
      toks.push({ k: fullIdx > 0 && fullIdx % song.perLine === 0 ? 'line' : 'bar' });
    }
    const d = (song.pickup === 0.5 && i === 0) ? 0.5 : 1;
    const beat = { b, noteStart: false };
    beats.push(beat);
    const c = parseCell(text);
    if (c.empty || c.bad) addRest(b, d, 'empty');
    else {
      const dd = d / c.units.length;
      if (c.units.length > 1) toks.push({ k: 'gs' });
      c.units.forEach((u, k) => {
        const st = b + k * dd;
        if (u.k === 'note') { addNote(u, st, dd); if (k === 0) beat.noteStart = true; }
        else if (u.k === 'hold') addHold(st, dd);
        else addRest(st, dd, 'rest');
      });
      if (c.units.length > 1) toks.push({ k: 'ge' });
    }
    b += d;
  });
  const playable = events.filter(e => e.midi != null);
  assignHands(playable);
  return { events, toks, beats, totalBeats: b, playable };
}

/* ═════════ 6. 번갈아 치기 (화면 속 채) ═════════ */
const HOME = { L: barByMidi.get(72).sx, R: barByMidi.get(79).sx };
const other = h => h === 'L' ? 'R' : 'L';
const CROSS = 100;
const crosses = (h, x, p) => h === 'L' ? x - p.R > CROSS : p.L - x > CROSS;

function assignHands(pl) {
  let pos = { L: HOME.L, R: HOME.R };
  let i = 0;
  while (i < pl.length) {
    let j = i + 1;
    while (j < pl.length && pl[j].start - pl[j - 1].start < 2 - 1e-6) j++;
    const phrase = pl.slice(i, j);
    const sim = startHand => {
      const p = { ...pos }, hs = [];
      let exp = startHand, dbl = 0;
      for (const e of phrase) {
        const x = e.bar.sx;
        let h = exp;
        if (crosses(h, x, p)) h = other(h);
        if (hs.length && hs[hs.length - 1] === h) dbl++;
        hs.push(h); p[h] = x; exp = other(h);
      }
      return { hs, dbl, p };
    };
    let r = sim('R');
    const l = sim('L');
    if (l.dbl < r.dbl) r = l;
    phrase.forEach((e, k) => { e.hand = r.hs[k]; });
    pos = r.p;
    i = j;
  }
}

/* ═════════ 8. 채 동작 ═════════ */
const hands = {

  R: { dir: 1, strikes: [], home: { x: barByMidi.get(79).hx, y: barByMidi.get(79).hy } }

const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;

const easeOut = u => 1 - (1 - u) * (1 - u);

function malletState(H, t) {

  for (let k = 0; k < a.length; k++) { if (a[k].t <= t) prev = a[k]; else { next = a[k]; break; } }

  let x = ax, y = ay;

    if (prev && gap < 0.36) {

      x = lerp(prev.x, next.x, e); y = lerp(prev.y, next.y, e);

    const d = next.t - t;

function nearestHand(bar) {
  const lastX = H => H.strikes.length ? H.strikes[H.strikes.length - 1].x : H.home.x;
  return Math.abs(bar.sx - lastX(hands.L)) <= Math.abs(bar.sx - lastX(hands.R)) ? hands.L : hands.R;
}

function addStrike(bar, t, H) {
  const s = { t, bar, x: bar.sx, y: bar.sy, hx: bar.hx, hy: bar.hy };
  const a = H.strikes;
  a.push(s);
  if (a.length > 1 && a[a.length - 2].t > t) a.sort((p, q) => p.t - q.t);
  allStrikes.push(s);
}

function clearFutureStrikes(t) {
  for (const H of [hands.L, hands.R]) H.strikes = H.strikes.filter(s => s.t <= t);
  allStrikes = allStrikes.filter(s => s.t <= t);
}

/* ═════════ 9. 소리 ═════════ */
let ctx = null, bus = null, master = null, liveBus = null;
function ensureAudio() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC({ latencyHint: 'interactive' });
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(comp);
    bus = ctx.createGain(); bus.connect(master);
    const conv = ctx.createConvolver(); conv.buffer = impulse(1.8);
    const wet = ctx.createGain(); wet.gain.value = 0.22;
    bus.connect(conv); conv.connect(wet); wet.connect(master);
    liveBus = ctx.createGain(); liveBus.connect(bus);
  }
  if (ctx.state === 'suspended') ctx.resume();
}
function impulse(sec) {
  const n = Math.floor(ctx.sampleRate * sec), buf = ctx.createBuffer(2, n, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  }
  return buf;
}
const PARTIALS = [[1, 1, 2.2], [2.756, .3, .7], [5.404, .12, .3], [8.933, .05, .14]];
function voice(midi, t, dest) {
  const f = 440 * Math.pow(2, (midi - 69) / 12);
  const k = Math.min(1.3, Math.pow(700 / f, 0.35));
  for (const [ratio, amp, dec] of PARTIALS) {
    const fr = f * ratio;
    if (fr > ctx.sampleRate / 2 - 500) continue;
    const d = dec * k;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = fr;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(amp * 0.22, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(dest);
    o.start(t); o.stop(t + d + 0.05);
  }
}
// 메트로놈 "삑" (1차 소리, 크기만 조절)
function tick(t, dest) {
  const v = state.metro.vol / 100 * 0.45;
  if (v <= 0) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine'; o.frequency.value = 1700;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(v, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t + 0.07);
}
const latency = () => ctx ? Math.min(0.25, Math.max(0, (ctx.outputLatency || 0) + (ctx.baseLatency || 0))) : 0;
const vnow = () => ctx ? ctx.currentTime - latency() : 0;

/* ═════════ 10. 재생 제어 ═════════ */
let TL = build(curSong());
const P = { playing: false, session: null, dry: null, spb: 60 / 90, passStart: 0, fromBeat: 0, endT: 0, nextPass: null, pausedBeat: 0 };
let stepPtr = 0;

function newSessions() {
  P.session = ctx.createGain(); P.session.connect(bus);
  P.dry = ctx.createGain(); P.dry.connect(master);
}
function killSession() {
  for (const k of ['session', 'dry']) {
    const g = P[k]; if (!g) continue;
    P[k] = null;
    g.gain.setTargetAtTime(0, ctx.currentTime, 0.015);
    setTimeout(() => g.disconnect(), 300);
  }
}

function schedulePass(fromBeat, t0) {
  for (const e of TL.playable) {
    if (e.start < fromBeat - 1e-6) continue;
    const t = t0 + (e.start - fromBeat) * P.spb;
    addStrike(e.bar, t, hands[e.hand]);
    voice(e.midi, t, P.session);
  }
  if (state.metro.mode === 'empty') {
    for (const bt of TL.beats) {
      if (bt.b < fromBeat - 1e-6 || bt.noteStart) continue;
      tick(t0 + (bt.b - fromBeat) * P.spb, P.dry);
    }
  }
}

function play(fromBeat, opts = {}) {
  ensureAudio();
  if (!TL.playable.length) return;
  if (fromBeat >= TL.totalBeats - 1e-6) fromBeat = 0;
  killSession();
  clearFutureStrikes(vnow());
  const song = curSong();
  P.spb = 60 / song.tempo;
  newSessions();
  let t0 = ctx.currentTime + 0.35;
  if (fromBeat < 1e-6 && state.metro.countIn && !opts.noCount) {
    const s0 = song.pickup > 0 ? -(song.meter - song.pickup) : -song.meter;
    const n = Math.ceil(-s0 - 1e-6);
    t0 += -s0 * P.spb;
    for (let k = 0; k < n; k++) tick(t0 + (s0 + k) * P.spb, P.dry);
  }
  schedulePass(fromBeat, t0);
  Object.assign(P, { playing: true, passStart: t0, fromBeat, endT: t0 + (TL.totalBeats - fromBeat) * P.spb, nextPass: null });
  syncButtons();
}

function currentBeat(t) { return P.fromBeat + (t - P.passStart) / P.spb; }

function pause() {
  if (!P.playing) return;
  const b = currentBeat(vnow());
  P.pausedBeat = Math.max(0, Math.min(TL.totalBeats, b));
  killSession();
  clearFutureStrikes(vnow());
  P.playing = false; P.nextPass = null;
  stepPtr = TL.playable.findIndex(e => e.start >= P.pausedBeat - 1e-6);
  if (stepPtr < 0) stepPtr = TL.playable.length;
  syncButtons();
}

function stopAll() {
  pause();
  P.pausedBeat = 0; stepPtr = 0;
  setActive(null);
  strip.scrollTo({ left: 0, behavior: 'smooth' });
}

function togglePlay() { if (P.playing) pause(); else play(P.pausedBeat); }

function liveHit(bar, H) {
  ensureAudio();
  const t = ctx.currentTime + 0.07;
  addStrike(bar, t, H || nearestHand(bar));
  voice(bar.midi, t, liveBus);
}

function stepNext() {
  ensureAudio();
  if (P.playing) pause();
  const pe = TL.playable;
  if (!pe.length) return;
  if (stepPtr >= pe.length) stepPtr = 0;
  const e = pe[stepPtr];
  liveHit(e.bar, hands[e.hand]);
  setActive(e.token);
  P.pausedBeat = e.start + e.dur;
  stepPtr++;
}
function stepPrev() {
  if (P.playing) pause();
  stepPtr = Math.max(0, stepPtr - 2);
  stepNext();
}

/* ═════════ 11. 악보줄 ═════════ */
const strip = $('strip');
let timedTokens = [], activeTok = null;

function renderStrip() {
  strip.innerHTML = '';
  activeTok = null;
  if (!TL.playable.length) {
    const p = document.createElement('span');
    p.className = 'empty';
    p.textContent = '편집에서 계이름을 입력하세요';
    strip.appendChild(p);
  }
  let grp = null;
  for (const tk of TL.toks) {
    if (tk.k === 'gs') { grp = document.createElement('span'); grp.className = 'grp'; strip.appendChild(grp); continue; }
    if (tk.k === 'ge') { grp = null; continue; }
    const node = document.createElement('span');
    if (tk.k === 'bar') node.className = 'sep';
    else if (tk.k === 'line') node.className = 'sep line';
    else {
      let label = '', color = 'transparent', cls = 'tk ' + tk.k;
      if (tk.k === 'note') {
        label = tk.label; color = tk.bar.color;
        if (tk.oct > 0) cls += ' hi';
        if (tk.oct < 0) cls += ' lo';
      } else if (tk.k === 'rest') label = '_';
      else if (tk.k === 'hold') label = '–';
      else label = '·';
      node.className = cls;
      const nm = document.createElement('span'); nm.textContent = label;
      const sw = document.createElement('i'); sw.className = 'sw'; sw.style.background = color;
      node.append(nm, sw);
    }
    tk.el = node;
    node._tk = tk;
    (grp || strip).appendChild(node);
  }
  timedTokens = TL.toks.filter(t => t.start != null);
  timedTokens.forEach((t, i) => { t.idx = i; });
  strip.scrollLeft = 0;
  syncSlider();
}

const slider = $('stripSlider');
let drag = null, userScrollT = -1e9;
const maxScroll = () => Math.max(0, strip.scrollWidth - strip.clientWidth);
const userScrolling = () => drag !== null || performance.now() - userScrollT < 2500;

function syncSlider() {
  const m = maxScroll();
  slider.hidden = m <= 0;
  slider.value = m > 0 ? Math.round(strip.scrollLeft / m * 1000) : 0;
}
strip.addEventListener('scroll', syncSlider, { passive: true });
window.addEventListener('resize', syncSlider);
slider.addEventListener('input', () => {
  userScrollT = performance.now();
  strip.scrollTo({ left: slider.value / 1000 * maxScroll(), behavior: 'instant' });
});
strip.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  drag = { x: e.clientX, left: strip.scrollLeft, moved: false, id: e.pointerId };
});
strip.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) > 6) {
    drag.moved = true;
    strip.setPointerCapture(drag.id);
    strip.classList.add('dragging');
  }
  if (drag.moved) {
    strip.scrollTo({ left: drag.left - dx, behavior: 'instant' });
    userScrollT = performance.now();
    syncSlider();
  }
});
strip.addEventListener('pointerup', e => {
  if (!drag) return;
  const moved = drag.moved;
  drag = null;
  strip.classList.remove('dragging');
  if (moved) return;
  const el = e.target.closest('.tk');
  if (el && el._tk && el._tk.start != null) playFromToken(el._tk);
});
strip.addEventListener('pointercancel', () => { drag = null; strip.classList.remove('dragging'); userScrollT = performance.now(); });
strip.addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  e.preventDefault();
  userScrollT = performance.now();
  strip.scrollTo({ left: strip.scrollLeft + e.deltaY, behavior: 'instant' });
  syncSlider();
}, { passive: false });

function playFromToken(tk) {
  const b = tk.k === 'hold' && tk.ev ? tk.ev.start : tk.start;
  userScrollT = -1e9;
  setActive(tk);
  play(b, { noCount: true });
}

function setActive(tk) {
  if (tk === activeTok) return;
  if (activeTok && activeTok.el) activeTok.el.classList.remove('now');
  activeTok = tk;
  const ai = tk ? tk.idx : -1;
  for (const t of timedTokens) t.el.classList.toggle('past', ai >= 0 && t.idx < ai);
  if (tk && tk.el) {
    tk.el.classList.add('now');
    if (userScrolling()) return;
    strip.scrollTo({ left: tk.el.offsetLeft - strip.clientWidth / 2 + tk.el.offsetWidth / 2, behavior: 'smooth' });
  }
}

function tokenAtBeat(b) {
  let lo = 0, hi = timedTokens.length - 1, ans = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (timedTokens[m].start <= b + 1e-6) { ans = m; lo = m + 1; } else hi = m - 1; }
  if (ans < 0) return null;
  const t = timedTokens[ans];
  return b < t.start + t.dur ? t : null;
}

/* ═════════ 12. 화면 갱신 루프 ═════════ */
let lastT = 0;
function frame() {
  const t = vnow();
  for (const s of allStrikes) if (s.t > lastT && s.t <= t) flashBar(s.bar);
  if (allStrikes.length > 300) allStrikes = allStrikes.filter(s => s.t > t - 1);
  for (const H of [hands.L, hands.R]) {
    while (H.strikes.length > 1 && H.strikes[1].t < t - 1) H.strikes.shift();
  }
  lastT = t;
  drawMallet(hands.L, malletState(hands.L, t));
  drawMallet(hands.R, malletState(hands.R, t));

  if (P.playing) {
    if (state.loop && !P.nextPass && ctx.currentTime > P.endT - 0.8) {
      const t1 = P.endT + P.spb;
      schedulePass(0, t1);
      P.nextPass = { t: t1 };
    }
    if (P.nextPass && t >= P.nextPass.t) {
      P.passStart = P.nextPass.t; P.fromBeat = 0;
      P.endT = P.passStart + TL.totalBeats * P.spb;
      P.nextPass = null;
    }
    if (!P.nextPass && t >= P.endT + 0.05) {
      P.playing = false; P.pausedBeat = 0; stepPtr = 0;
      P.session = null; P.dry = null;
      setActive(null);
      syncButtons();
    } else {
      const b = currentBeat(t);
      if (b >= P.fromBeat) setActive(tokenAtBeat(b));
    }
  }
  requestAnimationFrame(frame);
}

/* ═════════ 13. 무대 버튼 ═════════ */
const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>';
const ICON_FS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';
const ICON_FS_EXIT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>';

function syncButtons() {
  const b = $('btnPlay');
  b.innerHTML = P.playing ? ICON_PAUSE : ICON_PLAY;
  b.classList.toggle('playing', P.playing);
  b.setAttribute('aria-label', P.playing ? '일시정지' : '재생');
}
function syncFullscreenIcon() {
  const on = !!document.fullscreenElement;
  const b = $('btnFull');
  b.innerHTML = on ? ICON_FS_EXIT : ICON_FS;
  b.setAttribute('aria-label', on ? '전체화면 나가기' : '전체화면');
  document.body.classList.toggle('fs', on);
}
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen && document.exitFullscreen();
}
document.addEventListener('fullscreenchange', syncFullscreenIcon);

/* ═════════ 14. 편집 화면 ═════════ */
function refresh(keepPlayback) {
  if (!keepPlayback) stopAll();
  const song = curSong();
  TL = build(song);
  $('songTitle').textContent = song.title || '제목 없음';
  renderStrip();
  if (panelOpen()) renderEditor();
}
let lightTimer = 0;
function refreshLight() {
  clearTimeout(lightTimer);
  lightTimer = setTimeout(() => {
    if (P.playing) stopAll();
    TL = build(curSong());
    renderStrip();
  }, 250);
}

function renderEditor() {
  const song = curSong();
  const box = $('chips');
  box.innerHTML = '';
  for (const s of state.songs) {
    const b = document.createElement('button');
    b.className = 'chip' + (s.id === song.id ? ' on' : '');
    b.textContent = s.title || '제목 없음';
    b.addEventListener('click', () => selectSong(s.id));
    box.appendChild(b);
  }
  const add = document.createElement('button');
  add.className = 'chip add'; add.textContent = '+ 새 곡';
  add.addEventListener('click', newSong);
  box.appendChild(add);

  $('titleIn').value = song.title;
  const seg = $('segMeter'); seg.innerHTML = '';
  for (const m of [2, 3, 4]) {
    const b = document.createElement('button');
    b.textContent = m + '박'; b.className = m === song.meter ? 'on' : '';
    b.addEventListener('click', () => { song.meter = m; if (song.pickup >= m) song.pickup = 0; save(); refresh(); });
    seg.appendChild(b);
  }
  const ps = $('pickupSel'); ps.innerHTML = '';
  const opts = [[0, '없음'], [0.5, '반 박']];
  for (let k = 1; k < song.meter; k++) opts.push([k, k + '박']);
  for (const [v, l] of opts) { const o = document.createElement('option'); o.value = v; o.textContent = l; if (v === song.pickup) o.selected = true; ps.appendChild(o); }
  const pl = $('perLineSel'); pl.innerHTML = '';
  for (let k = 1; k <= 8; k++) { const o = document.createElement('option'); o.value = k; o.textContent = k + '마디'; if (k === song.perLine) o.selected = true; pl.appendChild(o); }
  $('tempo').value = song.tempo; $('tempoVal').textContent = song.tempo;

  for (const b of $('segMetro').children) b.classList.toggle('on', b.dataset.m === state.metro.mode);
  $('metroVol').value = state.metro.vol; $('metroVolVal').textContent = state.metro.vol;
  $('swCount').setAttribute('aria-checked', String(state.metro.countIn));
  $('swLoop').setAttribute('aria-checked', String(state.loop));

  renderGrid();
}

function renderGrid(focusIdx, caretEnd) {
  const song = curSong();
  const grid = $('grid');
  grid.innerHTML = '';
  if (!song.cells.length) song.cells.push('');
  const pc = pickupCells(song);
  const units = song.perLine * song.meter + pc;
  // 마디로 나누기
  const measures = [];
  let i = 0;
  if (pc) { measures.push({ from: 0, to: Math.min(pc, song.cells.length), pick: true }); i = pc; }
  while (i < song.cells.length) { measures.push({ from: i, to: Math.min(i + song.meter, song.cells.length) }); i += song.meter; }
  let row = null, used = 0, full = 0;
  const closeRow = () => { if (row && used < units) { const f = document.createElement('div'); f.className = 'filler'; f.style.flex = `${units - used} 1 0`; row.appendChild(f); } };
  for (const m of measures) {
    if (!row || (!m.pick && full > 0 && full % song.perLine === 0 && !row._fresh)) {
      closeRow();
      row = document.createElement('div'); row.className = 'grow'; grid.appendChild(row); used = 0; row._fresh = true;
    }
    const n = m.to - m.from;
    const ms = document.createElement('div'); ms.className = 'ms';
    ms.style.flex = `${m.pick ? pc : song.meter} 1 0`;
    const num = document.createElement('div'); num.className = 'mnum';
    num.textContent = m.pick ? '못갖춘마디' : String(full + 1);
    const cells = document.createElement('div'); cells.className = 'mcells';
    for (let k = m.from; k < m.to; k++) cells.appendChild(cellEl(k));
    const missing = (m.pick ? pc : song.meter) - n;
    if (missing > 0) { cells.style.flex = 'none'; cells.style.width = `${n / (n + missing) * 100}%`; }
    ms.append(num, cells);
    row.appendChild(ms);
    used += m.pick ? pc : song.meter;
    if (!m.pick) { full++; row._fresh = false; }
  }
  closeRow();
  if (focusIdx != null) {
    const inp = grid.querySelector(`input[data-i="${focusIdx}"]`);
    if (inp) { inp.focus(); const L = inp.value.length; inp.setSelectionRange(caretEnd ? L : 0, L); }
  }
}

function paintCell(el, text) {
  const c = parseCell(text);
  el.classList.toggle('bad', c.bad);
  el.classList.toggle('multi', (text || '').length > 2 || c.units.length > 1);
  const bs = el.querySelector('.bars');
  bs.innerHTML = '';
  if (!c.bad) for (const u of c.units) {
    const i = document.createElement('i');
    i.style.background = u.k === 'note' ? u.bar.color : 'transparent';
    bs.appendChild(i);
  }
}

function cellEl(i) {
  const song = curSong();
  const el = document.createElement('div'); el.className = 'cell';
  const inp = document.createElement('input');
  inp.type = 'text'; inp.value = song.cells[i]; inp.dataset.i = i;
  inp.autocomplete = 'off'; inp.spellcheck = false;
  inp.setAttribute('aria-label', `${i + 1}번째 칸`);
  const bs = document.createElement('span'); bs.className = 'bars';
  const el1 = document.createElement('span'); el1.className = 'edge l';
  const el2 = document.createElement('span'); el2.className = 'edge r';
  el.append(inp, bs, el1, el2);
  paintCell(el, song.cells[i]);

  el1.addEventListener('mousedown', e => { e.preventDefault(); insertCell(i); });
  el2.addEventListener('mousedown', e => { e.preventDefault(); insertCell(i + 1); });
  let moveAfterIME = false;
  inp.addEventListener('focus', () => inp.select());
  inp.addEventListener('input', () => {
    const v = inp.value.replace(/\s+/g, '');
    if (v !== inp.value) inp.value = v;
    song.cells[i] = v;
    paintCell(el, v);
    save(); refreshLight();
  });
  // 한글 입력 중 Enter·스페이스·Tab을 누르면 글자가 완성된 뒤 다음 칸으로
  inp.addEventListener('compositionend', () => {
    if (!moveAfterIME) return;
    moveAfterIME = false;
    setTimeout(() => { inp.value = inp.value.replace(/\s+/g, ''); song.cells[i] = inp.value; paintCell(el, inp.value); goCell(i + 1); }, 0);
  });
  inp.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Tab') { moveAfterIME = true; if (e.key === 'Tab') e.preventDefault(); }
      return;
    }
    const atEnd = inp.selectionStart === inp.value.length && inp.selectionEnd === inp.value.length;
    const atStart = inp.selectionStart === 0 && inp.selectionEnd === 0;
    if (e.key === 'Enter' || e.key === ' ' || (e.key === 'Tab' && !e.shiftKey) || (e.key === 'ArrowRight' && atEnd)) {
      e.preventDefault(); goCell(i + 1);
    } else if ((e.key === 'Tab' && e.shiftKey) || (e.key === 'ArrowLeft' && atStart)) {
      e.preventDefault(); goCell(i - 1, true);
    } else if (e.key === 'Delete') {
      e.preventDefault(); inp.value = ''; song.cells[i] = ''; paintCell(el, ''); save(); refreshLight();
    } else if (e.key === 'Backspace' && inp.value === '') {
      e.preventDefault(); removeCell(i);
    } else if (e.key === 'Escape') {
      e.preventDefault(); inp.blur(); closePanel();
    }
  });
  return el;
}

function goCell(j, caretEnd) {
  const song = curSong();
  if (j < 0) return;
  if (j >= song.cells.length) { song.cells.push(''); save(); refreshLight(); renderGrid(j); return; }
  const inp = $('grid').querySelector(`input[data-i="${j}"]`);
  if (inp) { inp.focus(); if (caretEnd) { const L = inp.value.length; inp.setSelectionRange(L, L); } }
}
function insertCell(at) {
  const song = curSong();
  song.cells.splice(at, 0, '');
  save(); refreshLight(); renderGrid(at);
}
function removeCell(i) {
  const song = curSong();
  if (song.cells.length <= 1) return;
  song.cells.splice(i, 1);
  save(); refreshLight(); renderGrid(Math.max(0, i - 1), true);
}

function selectSong(id) {
  state.cur = id; save();
  refresh();
}
function newSong() {
  const s = blankSong();
  state.songs.push(s);
  selectSong(s.id);
  $('titleIn').focus(); $('titleIn').select();
}

function openPanel() {
  $('panel').classList.add('open'); $('scrim').classList.add('open');
  $('panel').setAttribute('aria-hidden', 'false');
  renderEditor();
}
function closePanel() {
  $('panel').classList.remove('open'); $('scrim').classList.remove('open');
  $('panel').setAttribute('aria-hidden', 'true');
  if (document.activeElement) document.activeElement.blur();
}
const panelOpen = () => $('panel').classList.contains('open');

$('titleIn').addEventListener('input', () => {
  curSong().title = $('titleIn').value; save();
  $('songTitle').textContent = curSong().title || '제목 없음';
  const on = $('chips').querySelector('.chip.on'); if (on) on.textContent = curSong().title || '제목 없음';
});
$('pickupSel').addEventListener('change', () => { curSong().pickup = parseFloat($('pickupSel').value); save(); refresh(); });
$('perLineSel').addEventListener('change', () => { curSong().perLine = +$('perLineSel').value; save(); refresh(true); });
$('tempo').addEventListener('input', () => { curSong().tempo = +$('tempo').value; save(); $('tempoVal').textContent = curSong().tempo; });
$('tempo').addEventListener('change', () => { if (P.playing) { const b = currentBeat(vnow()); pause(); play(Math.max(0, b), { noCount: true }); } });
for (const b of $('segMetro').children) b.addEventListener('click', () => { state.metro.mode = b.dataset.m; save(); renderEditor(); });
$('metroVol').addEventListener('input', () => { state.metro.vol = +$('metroVol').value; $('metroVolVal').textContent = state.metro.vol; save(); });
$('metroVol').addEventListener('change', () => { ensureAudio(); tick(ctx.currentTime + 0.02, master); });
function bindSwitch(id, get, set) {
  $(id).addEventListener('click', () => { set(!get()); save(); $(id).setAttribute('aria-checked', String(get())); });
}
bindSwitch('swCount', () => state.metro.countIn, v => { state.metro.countIn = v; });
bindSwitch('swLoop', () => state.loop, v => { state.loop = v; });

$('btnDelete').addEventListener('click', () => {
  const s = curSong();
  if (!confirm(`'${s.title || '제목 없음'}' 곡을 지울까요?`)) return;
  state.songs = state.songs.filter(x => x.id !== s.id);
  if (PRESET_DEFS.some(d => d.id === s.id) && !state.removed.includes(s.id)) state.removed.push(s.id);
  if (!state.songs.length) state.songs.push(blankSong());
  selectSong(state.songs[0].id);
});
$('btnExport').addEventListener('click', () => {
  const data = JSON.stringify({ app: 'glockenspiel23', version: 3, songs: state.songs }, null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = '실로폰-내곡.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('btnImport').addEventListener('click', () => $('fileIn').click());
$('fileIn').addEventListener('change', async () => {
  const f = $('fileIn').files[0];
  $('fileIn').value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const list = (data && Array.isArray(data.songs) ? data.songs : []);
    let n = 0;
    for (const s of list) {
      let cells = null;
      if (Array.isArray(s.cells)) cells = s.cells.map(c => String(c || ''));
      else if (Array.isArray(s.measures)) cells = trimCells(s.measures.flat().map(v2Cell));
      if (!cells || typeof s.title !== 'string') continue;
      const meter = [2, 3, 4].includes(s.meter) ? s.meter : 4;
      state.songs.push({ id: newId(), title: s.title, tempo: +s.tempo || 90, meter,
        pickup: [0, 0.5, 1, 2, 3].includes(s.pickup) && s.pickup < meter ? s.pickup : 0,
        perLine: Math.min(8, Math.max(1, +s.perLine || 4)), cells: cells.length ? cells : [''] });
      n++;
    }
    save();
    renderEditor();
    if (!n) alert('가져올 곡이 없어요.');
  } catch (e) {
    alert('파일을 읽지 못했어요.');
  }
});

/* ═════════ 15. 무대·키보드 연결 ═════════ */
$('btnPlay').addEventListener('click', togglePlay);
$('btnStop').addEventListener('click', stopAll);
$('btnEdit').addEventListener('click', () => panelOpen() ? closePanel() : openPanel());
$('btnFull').addEventListener('click', toggleFullscreen);
$('btnClose').addEventListener('click', closePanel);
$('btnApply').addEventListener('click', closePanel);
$('scrim').addEventListener('click', closePanel);

// 마우스·터치로 누른 버튼은 포커스를 풀어 스페이스바가 두 번 눌리지 않게 함
document.addEventListener('pointerup', e => {
  const b = e.target.closest && e.target.closest('button');
  if (b && !b.closest('.panel')) setTimeout(() => b.blur(), 0);
});

document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT') { if (e.key === 'Escape') closePanel(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (panelOpen()) { if (e.key === 'Escape') { e.preventDefault(); closePanel(); } return; }
  if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  let handled = true;
  switch (e.key) {
    case ' ': togglePlay(); break;
    case 'ArrowRight': case 'ArrowDown': case 'PageDown': stepNext(); break;
    case 'ArrowLeft': case 'ArrowUp': case 'PageUp': stepPrev(); break;
    case 'Home': case 'Escape': stopAll(); break;
    case 'f': case 'F': case 'ㄹ': toggleFullscreen(); break;
    case 'e': case 'E': case 'ㄷ': openPanel(); break;
    default: handled = false;
  }
  if (handled) e.preventDefault();
});

/* ═════════ 16. 시작 ═════════ */
buildXylophone();
syncButtons();
syncFullscreenIcon();
save();
refresh(true);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
